- key: exquisite-land
  name: Exquisite Land
  website: https://exquisite.land
  kind: art-drop
  hosts: [agents.exquisite.land]
  minters: ["0xde152afb7db5373f34876e1499fbd893a82dd336"]

- key: normies
  name: Normies
  website: https://normies.art
